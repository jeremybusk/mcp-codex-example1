settings:
  max_output_bytes: 65536

database:
  enabled: true
  max_rows: 200
  max_query_bytes: 10000
  statement_timeout_ms: 5000

# Only enabled entries are exposed. argv is never passed to a local shell.
# Use absolute paths as they exist on the remote Ubuntu host.
commands:
  uptime:
    enabled: true
    description: Show server uptime and load.
    risk: read
    confirmation: false
    argv: ["/usr/bin/uptime"]

  disk_usage:
    enabled: true
    description: Show filesystem free space.
    risk: read
    confirmation: false
    argv: ["/usr/bin/df", "-h", "--output=source,fstype,size,used,avail,pcent,target"]

  service_status:
    enabled: true
    description: Show status for one explicitly permitted systemd service.
    risk: read
    confirmation: false
    argv: ["/usr/bin/sudo", "-n", "/usr/bin/systemctl", "status", "{service}", "--no-pager"]
    timeout: 20
    parameters:
      service:
        type: enum
        values: ["nginx", "postgresql", "ssh"]

  journal:
    enabled: false
    description: Read recent logs for an explicitly permitted service.
    risk: read
    confirmation: false
    argv: ["/usr/bin/sudo", "-n", "/usr/bin/journalctl", "-u", "{service}", "-n", "{lines}", "--no-pager"]
    parameters:
      service:
        type: enum
        values: ["nginx", "postgresql", "ssh"]
      lines:
        type: integer
        min: 1
        max: 500
        default: 100

  process_list:
    enabled: true
    description: List all processes with full details.
    risk: read
    confirmation: false
    argv: ["/usr/bin/ps", "-eaf"]

  postgres_processes:
    enabled: true
    description: List PostgreSQL processes.
    risk: read
    confirmation: false
    argv: ["/usr/bin/pgrep", "-a", "-u", "postgres"]

  bash:
    enabled: true
    description: Run an arbitrary Bash script. This permits unrestricted remote execution.
    risk: write
    confirmation: true
    argv: ["/usr/bin/bash", "-lc", "{script}"]
    timeout: 120
    parameters:
      script:
        type: string
        max_length: 4000
        pattern: '(?s)^.+$'
