services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      SSH_HOST: ${SSH_HOST:-}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_USER: ${SSH_USER:-ubuntu}
      SSH_KEY: /app/ssh/id_ed25519
      SSH_KNOWN_HOSTS: /app/ssh/known_hosts
      MCP_CONFIG: /app/config/commands.yaml
      QUICKWIT_URL: http://quickwit:7280
      CHAT_INDEX_ID: ${CHAT_INDEX_ID:-chat-history-v1}
      CHAT_HISTORY_OWNER: ${CHAT_HISTORY_OWNER:-local}
    volumes:
      - ./config:/app/config:ro
      - ${SSH_KEY_FILE:-./.ssh/mcp}:/app/ssh/id_ed25519:ro
      - ${SSH_KNOWN_HOSTS_FILE:-./.ssh/known_hosts}:/app/ssh/known_hosts:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;s=socket.create_connection(('127.0.0.1',8000),2);s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend, chat_search]

  quickwit:
    image: ${QUICKWIT_IMAGE:-quickwit/quickwit:0.9.0}
    restart: unless-stopped
    command: ["run"]
    environment:
      QW_ENABLE_TELEMETRY: "false"
    volumes:
      - ./data/quickwit:/quickwit/qwdata
    expose:
      - "7280"
    healthcheck:
      test: ["CMD", "quickwit", "index", "list"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [chat_search]

  chat-indexer:
    build:
      context: .
      dockerfile: chat_indexer/Dockerfile
    restart: unless-stopped
    environment:
      QUICKWIT_URL: http://quickwit:7280
      CHAT_INDEX_ID: ${CHAT_INDEX_ID:-chat-history-v1}
      CHAT_SCAN_SECONDS: ${CHAT_SCAN_SECONDS:-30}
    volumes:
      - ./config/chat-sources.yaml:/config/chat-sources.yaml:ro
      - ./config/chat-history-index.yaml:/config/chat-history-index.yaml:ro
      - ./data/codex:/sources/codex:ro
      - ./data/opencode:/sources/opencode:ro
      - ./data/chat-indexer:/state
    depends_on:
      quickwit:
        condition: service_healthy
    networks: [chat_search]

  codex:
    environment:
      GRAFANA_MCP_SERVER_TOKEN: ${GRAFANA_MCP_SERVER_TOKEN:?Set GRAFANA_MCP_SERVER_TOKEN in .env}
    build:
      context: .
      dockerfile: Dockerfile.codex
    stdin_open: true
    tty: true
    depends_on:
      mcp-server:
        condition: service_healthy
    volumes:
      - ./data/codex:/root/.codex
      - ./workspace:/workspace
      - ./config/codex.toml:/opt/codex/config.toml:ro
    networks: [backend, grafana_clients]

  opencode:
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?Set OPENAI_BASE_URL in .env}
      GRAFANA_MCP_SERVER_TOKEN: ${GRAFANA_MCP_SERVER_TOKEN:?Set GRAFANA_MCP_SERVER_TOKEN in .env}
    build:
      context: .
      dockerfile: Dockerfile.opencode
    stdin_open: true
    tty: true
    depends_on:
      mcp-server:
        condition: service_healthy
    volumes:
      - ./data/opencode:/opencode
      - ./workspace:/workspace
      - ./config/opencode.json:/opt/opencode/opencode.json:ro
    networks: [backend, grafana_clients]

  grafana-mcp:
    image: ${GRAFANA_MCP_IMAGE:-grafana/mcp-grafana@sha256:f21a19cebbfa7c3a76ef1746171e5ffc3601064e432f593e7c6cb526e5216e5f}
    profiles: [grafana]
    restart: unless-stopped
    command:
      - "-t"
      - "streamable-http"
      - "--address"
      - ":8000"
      - "--endpoint-path"
      - "/mcp"
      - "--allowed-hosts"
      - "grafana-mcp:8000"
      - "--disable-write"
      - "--max-loki-log-limit"
      - "200"
    environment:
      GRAFANA_URL: ${GRAFANA_URL:-https://curiousmustard3132.grafana.net/}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GF_SERVICE_ACCOUNT_TOKEN:?Set GF_SERVICE_ACCOUNT_TOKEN in .env}
      GF_SERVICE_ACCOUNT_NAME: ${GF_SERVICE_ACCOUNT_NAME:-grafana-mcp}
      MCP_GRAFANA_SERVER_TOKEN: ${GRAFANA_MCP_SERVER_TOKEN:?Set GRAFANA_MCP_SERVER_TOKEN in .env}
    expose:
      - "8000"
    networks: [grafana_clients]

  web-ui:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      MCP_URL: http://mcp-server:8000/mcp
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?Set WEB_SESSION_SECRET in .env}
      AUDIT_PATH: /data/audit.jsonl
    volumes:
      - ./data/web:/data
    depends_on:
      mcp-server:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  web-gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      WEB_HOST: ${WEB_HOST:-localhost}
      WEB_USERNAME: ${WEB_USERNAME:-admin}
      WEB_PASSWORD_HASH: ${WEB_PASSWORD_HASH:?Set WEB_PASSWORD_HASH in .env}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8443}:8443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      web-ui:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
  grafana_clients:
  chat_search:
    internal: true
